<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Forever? ❤️</title>
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Interactive Card -->
    <main class="card">
        <div class="emoji" id="emoji">💌</div>
        <h1 id="heading">Will you be my forever?</h1>
        
        <div class="btn-container" id="buttons">
            <button class="btn btn-yes" id="yesBtn" onclick="selectYes()">Yes 💕</button>
            <button class="btn btn-no" id="noBtn" onclick="selectNo()">No</button>
        </div>

        <p class="paragraph" id="message"></p>
    </main>

    <!-- JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
